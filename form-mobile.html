<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17302b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="form-mobile.webmanifest"><title>FORM Mobile</title><script type="module">import{FilesetResolver,PoseLandmarker}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs';window.vision={FilesetResolver,PoseLandmarker};</script>
  <style>
    :root{--ink:#16332d;--paper:#f6f5f0;--card:#fffefa;--line:#dfe4dc;--muted:#72817b;--lime:#c8f169;--mint:#c6eee1;--coral:#ff9e6b}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Inter,system-ui,'Apple SD Gothic Neo',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}.shell{max-width:480px;margin:auto;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:19px;font-weight:950;letter-spacing:-1px}.brand i{display:inline-block;width:9px;height:9px;background:var(--lime);border-radius:99px;margin-left:2px}.today{font-size:12px;color:var(--muted);font-weight:700}.member{background:var(--ink);color:#fff;padding:17px;border-radius:17px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 14px 30px #17302b24}.member small{display:block;color:#bed0ca;font-size:11px;margin-bottom:3px}.member b{font-size:20px;letter-spacing:-1px}.change{background:#ffffff22;color:#fff;border:1px solid #ffffff30;border-radius:9px;padding:8px 10px;font:inherit;font-size:11px;font-weight:800}.intro{margin:24px 2px 13px}.intro h1{font-size:24px;line-height:1.15;letter-spacing:-1.4px;margin:0}.intro p{font-size:13px;color:var(--muted);margin:6px 0}.mode{display:flex;background:#e8ebe4;border-radius:11px;padding:4px;gap:4px;margin:17px 0}.mode button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:8px;font:inherit;font-size:12px;font-weight:800;color:var(--muted)}.mode button.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px #17302b12}.label{font-size:11px;font-weight:900;letter-spacing:.9px;color:#587168;margin:17px 2px 9px}.views{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.view{border:1px solid var(--line);padding:13px 8px;border-radius:13px;background:var(--card);font:inherit;color:var(--ink);text-align:left;min-height:116px}.view.active{background:var(--mint);border:2px solid var(--ink);padding:12px 7px}.view span{display:grid;place-items:center;height:47px;border-radius:9px;background:#eff2ec;font-size:24px;margin-bottom:9px}.view.active span{background:#ffffff9e}.view b{font-size:13px;display:block}.view small{font-size:10px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{font-size:16px;letter-spacing:-.6px;margin:0}.pill{background:#f0f3ec;color:#60766d;font-size:10px;font-weight:800;padding:5px 7px;border-radius:99px}.check{display:flex;align-items:center;gap:10px;padding:12px 1px;border-bottom:1px solid #edf0ea;font-size:13px}.check:last-of-type{border:0}.check input{appearance:none;width:21px;height:21px;border:1.5px solid #bfcabf;border-radius:7px;margin:0;display:grid;place-content:center}.check input:checked{background:var(--ink);border-color:var(--ink)}.check input:checked:after{content:'✓';color:#fff;font-weight:900;font-size:13px}.note{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:13px;min-height:74px;resize:none;background:#fbfcf8}.photo{display:flex;align-items:center;gap:10px;margin-top:12px;border:1.5px dashed #bbc7ba;border-radius:11px;padding:13px;color:var(--muted);font-size:12px}.photo input{display:none}.photo b{display:block;color:var(--ink);font-size:12px}.photo img{height:50px;width:50px;border-radius:8px;object-fit:cover;margin-left:auto}.save{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(448px,calc(100% - 32px));border:0;border-radius:13px;background:var(--lime);color:var(--ink);padding:16px;font:inherit;font-weight:950;font-size:15px;box-shadow:0 10px 25px #17302b2b}.toast{position:fixed;top:calc(15px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;padding:10px 14px;border-radius:99px;font-size:12px;font-weight:700;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}.sheet{position:fixed;inset:0;background:#17302b4d;display:none;align-items:end}.sheet.open{display:flex}.sheet-box{background:var(--card);padding:22px 16px calc(22px + env(safe-area-inset-bottom));width:100%;border-radius:20px 20px 0 0}.sheet-box h2{margin:0 0 12px;font-size:19px}.person{width:100%;background:#f2f5ef;border:0;border-radius:11px;padding:14px;text-align:left;font:inherit;margin:4px 0}.person b{display:block}.person small{color:var(--muted)}.close{margin-top:10px;width:100%;border:0;padding:13px;background:none;font:inherit;font-weight:800;color:var(--muted)}
    .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.photo-slot{position:relative;display:grid;place-items:center;min-height:92px;border:1.5px dashed #bbc7ba;border-radius:12px;overflow:hidden;text-align:center;color:var(--muted);font:inherit;font-size:11px;font-weight:800;background:var(--card);cursor:pointer}.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.photo-slot em{font-style:normal;font-size:18px;display:block;margin-bottom:4px}.photo-slot.has-photo{border-style:solid;border-color:var(--ink);color:white;text-shadow:0 1px 5px #000}.photo-slot.has-photo span{position:relative;z-index:1}.photo-input{display:none}.ai-card{background:#edf7df;border:1px solid #d2e6b9;border-radius:11px;padding:11px;margin:8px 0 4px;font-size:12px}.ai-card b{display:block;margin-bottom:4px}.ai-card small{color:#557062}.analyze{width:100%;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:12px;font:inherit;font-size:13px;font-weight:850;margin:12px 0 4px}
  </style>
</head>
<body><main class="shell"><header class="top"><div class="brand">FORM<i></i></div><div class="today" id="today"></div></header><section class="member"><div><small>평가 중인 회원</small><b id="memberName">김서윤</b></div><button class="change" id="change">회원 변경</button></section><section class="intro"><h1 id="title">정적 자세 평가</h1><p id="subtitle">정면·측면·후면 사진을 붙인 뒤 한 시점씩 평가하세요.</p></section><div class="mode"><button class="active" data-mode="static">정적 평가</button><button data-mode="ohs">오버헤드 스쿼트</button></div><p class="label">사진 첨부 · 정면 / 측면 / 후면</p><section class="card"><div class="photo-grid" id="photoGrid"></div></section><p class="label">평가할 관찰 시점</p><div class="views" id="views"></div><section class="card"><div class="head"><h2 id="checkTitle">정면 관찰</h2><span class="pill" id="counter">0 / 4 체크</span></div><div id="checks"></div><textarea class="note" id="note" placeholder="관찰 내용과 다음 세션의 가설을 짧게 기록하세요."></textarea></section></main><button class="save" id="save">이 시점 저장</button><div class="toast" id="toast">기록을 저장했어요</div><div class="sheet" id="sheet"><div class="sheet-box"><h2>회원 선택</h2><div id="people"></div><button class="close" id="close">닫기</button></div></div>
<script>
const sets={static:[['front','정면','◒',['발·발목 평행·외회전','무릎-발가락 정렬','골반(ASIS) 수평','어깨 수평·둥근어깨','머리 중심·회전']],['side','측면','◐',['발목 중립','무릎 중립·과신전','골반 중립·요추 정렬','어깨·흉추 곡선','머리 전방돌출']],['back','후면','◓',['뒤꿈치·발 정렬','무릎 정렬','골반(ASIS) 수평','견갑·어깨 수평','척추·머리 중심']]],ohs:[['front','정면','↕',['무릎 내반/외반','발 아치 붕괴','골반 중립 유지','항회전 몸통 제어']],['side','측면','↕',['몸통 전방 기울임','힙 힌지','골반 전·후방경사','호흡-흉곽 제어']],['back','후면','↕',['무릎 추적','골반 이동','발 회내','견갑·회전 제어']]]};
let state=JSON.parse(localStorage.getItem('form-mobile')||'null')||{people:[{id:'kim',name:'김서윤',goal:'통증 없는 안정적인 스쿼트'},{id:'park',name:'박민준',goal:'가동범위와 무릎 정렬 개선'}],person:'kim',mode:'static',side:'front',records:{}};const $=x=>document.querySelector(x),key=()=>state.person+'-'+state.mode+'-'+state.side,saveState=()=>localStorage.setItem('form-mobile',JSON.stringify(state));
function data(){return sets[state.mode].find(x=>x[0]===state.side)}function render(){let d=data(),r=state.records[key()]||{checks:[],note:'',image:''},p=state.people.find(x=>x.id===state.person);$('#today').textContent=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric'});$('#memberName').textContent=p.name;$('#title').textContent=state.mode==='static'?'정적 자세 평가':'오버헤드 스쿼트';$('#subtitle').textContent=p.goal;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.mode));$('#photoGrid').innerHTML=sets[state.mode].map(x=>{let image=(state.records[state.person+'-'+state.mode+'-'+x[0]]||{}).image,id=`photo-${state.mode}-${x[0]}`;return `<button class="photo-slot ${image?'has-photo':''}" type="button" data-photo-picker="${id}">${image?`<img src="${image}" alt="${x[1]} 사진">`:''}<span><em>${image?'✓':'＋'}</em>${x[1]} 사진</span></button><input class="photo-input" id="${id}" type="file" accept="image/*" capture="environment" data-photo-side="${x[0]}">`}).join('');$('#views').innerHTML=sets[state.mode].map(x=>{let record=state.records[state.person+'-'+state.mode+'-'+x[0]]||{};return `<button class="view ${x[0]===state.side?'active':''}" data-side="${x[0]}"><span>${x[2]}</span><b>${x[1]}</b><small>${record.image?'사진 첨부됨':record.note?'기록 완료':'사진 미첨부'}</small></button>`}).join('');$('#checkTitle').textContent=d[1]+' 관찰';$('#checks').innerHTML=d[3].map(x=>`<label class="check"><input type="checkbox" value="${x}" ${r.checks.includes(x)?'checked':''}>${x}</label>`).join('');$('#note').value=r.note;$('#counter').textContent=r.checks.length+' / '+d[3].length+' 체크';}
document.addEventListener('click',e=>{let m=e.target.closest('[data-mode]'),s=e.target.closest('[data-side]'),p=e.target.closest('[data-person]'),picker=e.target.closest('[data-photo-picker]');if(picker){document.getElementById(picker.dataset.photoPicker).click();return}if(m){state.mode=m.dataset.mode;state.side='front';saveState();render()}if(s){state.side=s.dataset.side;saveState();render()}if(p){state.person=p.dataset.person;saveState();$('#sheet').classList.remove('open');render()}if(e.target.id==='change'){$('#people').innerHTML=state.people.map(x=>`<button class="person" data-person="${x.id}"><b>${x.name}</b><small>${x.goal}</small></button>`).join('');$('#sheet').classList.add('open')}if(e.target.id==='close')$('#sheet').classList.remove('open');if(e.target.id==='save'){let old=state.records[key()]||{};state.records[key()]={checks:[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value),note:$('#note').value,image:old.image||''};saveState();$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800);render()}});
function compressPhoto(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=()=>reject(new Error('사진을 읽지 못했습니다.'));reader.onload=()=>{let image=new Image();image.onerror=()=>reject(new Error('이미지 파일을 열지 못했습니다.'));image.onload=()=>{let max=1280,scale=Math.min(1,max/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};image.src=reader.result};reader.readAsDataURL(file)})}document.addEventListener('change',async e=>{if(e.target.type==='checkbox'){$('#counter').textContent=document.querySelectorAll('input[type=checkbox]:checked').length+' / '+data()[3].length+' 체크'}if(e.target.dataset.photoSide&&e.target.files[0]){let side=e.target.dataset.photoSide;try{let photoKey=state.person+'-'+state.mode+'-'+side,old=state.records[photoKey]||{note:''};state.records[photoKey]={checks:[],note:old.note||'',image:await compressPhoto(e.target.files[0])};saveState();$('#toast').textContent=side==='front'?'정면 사진을 첨부했어요':side==='side'?'측면 사진을 첨부했어요':'후면 사진을 첨부했어요';$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800);render()}catch(error){$('#toast').textContent='사진 저장에 실패했어요. 더 작은 사진으로 다시 시도해 주세요.';$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2800)}}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('form-mobile-sw.js').catch(()=>{});
let poseModel;const baseRender=render;function paintAi(){let record=state.records[key()]||{},options=data()[3];$('#checks').innerHTML=record.ai?`<div class="ai-card"><b>AI 1차 평가</b><small>${record.ai}</small></div><p class="label">트레이너 최종 확인 · 필요 시 수정</p>${options.map(x=>`<label class="check"><input type="checkbox" value="${x}" ${record.checks.includes(x)?'checked':''}>${x}</label>`).join('')}`:`<div class="ai-card"><b>AI 1차 평가 대기</b><small>사진에서 포즈를 인식해 우선 관찰 항목을 제안합니다.</small></div><button class="analyze" id="analyze">AI 1차 평가 시작</button>`}render=function(){baseRender();paintAi()};async function getPose(){if(poseModel)return poseModel;if(!window.vision)throw new Error('분석 엔진을 불러오는 중입니다. 잠시 후 다시 시도해 주세요.');let files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm');poseModel=await vision.PoseLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task'},runningMode:'IMAGE',numPoses:1});return poseModel}async function autoReview(image){let model=await getPose(),img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=image});let marks=model.detect(img).landmarks?.[0];if(!marks)throw new Error('포즈 미인식');let items=data()[3],difference=(a,b)=>Math.abs(marks[a].y-marks[b].y),result=[];if(data().side!=='side'){if(difference(11,12)>.035)result.push(items[state.mode==='static'?3:1]||items[0]);if(difference(23,24)>.04)result.push(items[2]||items[1])}else{if(Math.abs(marks[7].x-marks[11].x)>.1)result.push(items[state.mode==='static'?4:0]||items[0]);if(Math.abs(marks[11].x-marks[23].x)>.15)result.push(items[state.mode==='static'?2:1]||items[1])}return [...new Set(result.filter(Boolean))]}document.addEventListener('click',async e=>{if(e.target.id!=='analyze')return;let record=state.records[key()]||{};if(!record.image){$('#toast').textContent='먼저 현재 시점의 사진을 첨부해 주세요.';$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200);return}e.target.textContent='AI가 사진을 분석 중…';try{let checks=await autoReview(record.image),baseSummary=checks.length?`${checks.join(' · ')} 항목을 우선 확인해 보세요.`:'뚜렷한 정렬 비대칭 신호를 찾지 못했습니다. 움직임과 통증 반응을 함께 확인하세요.',sourceCue=state.mode==='ohs'?'자료 기준: 골반 중립·항회전 제어·호흡-흉곽 협응을 우선 확인합니다.':'NASM-CES 정적 기준: 발·무릎·LPHC·어깨·머리를 정면·측면·후면에서 함께 확인합니다.',summary=`${baseSummary} ${sourceCue}`;state.records[key()]={...record,checks,ai:summary};saveState();render()}catch(error){console.error(error);$('#toast').textContent=error.message==='포즈 미인식'?'전신이 보이도록 다시 촬영해 주세요.':error.message||'자동 평가 엔진을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),3000)}});render();
</script></body></html>
